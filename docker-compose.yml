services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - expensehub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../.docker/backend/Dockerfile
      target: development
    container_name: ${COMPOSE_PROJECT_NAME}_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
      - ./.docker/backend/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
      - ./.docker/backend/xdebug.ini:/usr/local/etc/php/conf.d/50-xdebug.ini:ro
      - ./.docker/backend/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expensehub

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT}:80"
      - "${APP_HTTPS_PORT}:443"
    volumes:
      - ./backend:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.docker/certs/generated/server.crt:/etc/nginx/certs/server.crt:ro
      - ./.docker/certs/generated/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - backend
    networks:
      - expensehub

  web:
    build:
      context: ./web
      dockerfile: ../.docker/web/Dockerfile
      target: development
    container_name: ${COMPOSE_PROJECT_NAME}_web
    restart: unless-stopped
    env_file:
      - ./web/.env.local
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports:
      - "${WEB_PORT}:3000"
    depends_on:
      - nginx
    networks:
      - expensehub

networks:
  expensehub:
    driver: bridge

volumes:
  postgres_data:
  web_node_modules:
  web_next: